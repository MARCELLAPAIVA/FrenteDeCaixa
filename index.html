let S={nome:'Minha Loja',p:[],v:[],e:[],c:[],cx:{open:null,mov:[],hist:[]}},tab='vendas',pdv=false,cart=[],pay='dinheiro',per='hoje',ED=null,M=null,sb=null,st='Conectando ao Supabase…',tm;

L.forEach(l=>{const k=l.p.pq>0&&l.p.pv>0&&!l.i.nc?l.p.pq+'x'+l.p.pv:'';if(k){const g=G[k]||(G[k]={N:l.p.pq,V:l.p.pv,ls:[],q:0});g.ls.push(l);g.q+=l.q}});

function add(code){code=(code||'').trim();if(!code)return;const l=code.toLowerCase();const p=S.p.find(x=>x.c&&x.c===code)||S.p.find(x=>x.n.toLowerCase()===l)||S.p.find(x=>x.n.toLowerCase().includes(l));if(!p)return toast('Produto não encontrado');const i=cart.find(x=>x.id===p.id);i?i.q++:cart.push({id:p.id,q:1});render()}
function cxs(){const o=S.cx.open,vs=S.v.filter(v=>v.t>=o.t),by=m=>vs.filter(v=>v.pg===m).reduce((a,v)=>a+v.tot,0),mv=k=>S.cx.mov.filter(m=>m.t>=o.t&&m.tp===k).reduce((a,m)=>a+m.v,0);const din=by('dinheiro'),sup=mv('sup'),san=mv('san');return{vs,din,pix:by('pix'),car:by('cartão'),sup,san,esp:o.v+din+sup-san}}
function rcp(v){const w=32,L=[S.nome||'Minha Loja','Recibo de venda nº '+v.n,dt(v.t),'-'.repeat(w)];v.it.forEach(i=>{L.push(i.n);L.push(((i.q+' x '+R(i.pr)).padEnd(w-11))+R(i.sub).padStart(11))});L.push('-'.repeat(w));if(v.dc>0.001)L.push('Desconto'.padEnd(w-11)+('-'+R(v.dc)).padStart(11));L.push('TOTAL'.padEnd(w-12)+R(v.tot).padStart(12),'Pagamento: '+v.pg,'','Obrigado pela preferência!','(Documento sem valor fiscal)');return '<pre>'+esc(L.join('\n'))+'</pre>'}
function prt(h){$('#rec').innerHTML=h;try{window.print()}catch(e){toast('Impressão indisponível neste navegador')}}
function vP(){const e=ED?find(ED):{},F=(id,l,v,t)=>'<label>'+l+'<input id="'+id+'" type="'+(t||'text')+'" step="any" value="'+esc(v==null?'':v)+'"></label>';

function vE(){const low=S.p.filter(p=>p.es<=p.mi).length;return '<div class="card"><p>'+(low?'<b class="r">'+low+' produto(s) com estoque baixo</b>':'Estoque em dia')+' · Valor em estoque (custo): <b>'+R(S.p.reduce((a,p)=>a+p.es*p.cu,0))+'</b></p><table>'+S.p.map(p=>'<tr><td>'+esc(p.n)+'</td><td class="n '+(p.es<=p.mi?'r':'')+'"><b>'+p.es+'</b></td><td class="n"><button class="s" data-a="ent" data-id="'+p.id+'">+ entrada</button> <button class="s" data-a="aj" data-id="'+p.id+'">ajuste</button></td></tr>').join('')+'</table></div><div class="card"><h3>Últimas movimentações</h3><table>'+S.e.slice(0,15).map(m=>'<tr><td>'+dt(m.t)+'</td><td>'+esc(m.n)+'</td><td class="n '+(m.q<0?'r':'g')+'">'+(m.q>0?'+':'')+m.q+'</td><td>'+m.tp+'</td></tr>').join('')+'</table></div>'}
function vC(){if(!S.cx.open)return '<div class="card"><h3>Caixa fechado</h3><label>Valor inicial em dinheiro<input id="ab" type="number" step="any" value="0"></label><button class="p" data-a="abrir">Abrir caixa</button></div>'+vH();const c=cxs();return '<div class="card"><h3>Caixa aberto</h3><p class="mu">Desde '+dt(S.cx.open.t)+'</p><div class="grid"><div class="k">Abertura<b>'+R(S.cx.open.v)+'</b></div><div class="k">Vendas ('+c.vs.length+')<b>'+R(c.vs.reduce((a,v)=>a+v.tot,0))+'</b></div><div class="k">Dinheiro<b>'+R(c.din)+'</b></div><div class="k">Pix<b>'+R(c.pix)+'</b></div><div class="k">Cartão<b>'+R(c.car)+'</b></div><div class="k">Suprimentos − sangrias<b>'+R(c.sup-c.san)+'</b></div></div><div class="tot"><span>Dinheiro esperado</span><b>'+R(c.esp)+'</b></div><div class="row"><button data-a="sup">Suprimento</button><button data-a="san">Sangria</button><button class="p" data-a="fecha">Fechar caixa</button></div></div>'+vH()}
function vH(){return S.cx.hist.length?'<div class="card"><h3>Fechamentos</h3><table>'+S.cx.hist.slice(0,10).map(h=>'<tr><td>'+dt(h.f)+'</td><td class="n">esperado '+R(h.esp)+'<br>contado '+R(h.cont)+'</td><td class="n '+(Math.abs(h.dif)>0.009?'r':'g')+'">'+(h.dif>0?'+':'')+R(h.dif)+'</td></tr>').join('')+'</table></div>':''}
function vA(){const hj=new Date().toLocaleDateString('sv'),a=S.c.filter(c=>!c.pg),v=a.filter(c=>c.ve<hj);return '<div class="card"><h3>Nova conta a pagar</h3><label>Descrição<input id="c_d"></label><div class="grid"><label>Valor<input id="c_v" type="number" step="any"></label><label>Vencimento<input id="c_t" type="date"></label></div><button class="p" data-a="cadd">Adicionar</button></div><div class="card"><p>Em aberto: <b>'+R(a.reduce((s,c)=>s+c.v,0))+'</b> · Vencidas: <b class="r">'+R(v.reduce((s,c)=>s+c.v,0))+'</b></p><table>'+S.c.slice().sort((x,y)=>(x.pg?1:0)-(y.pg?1:0)||x.ve.localeCompare(y.ve)).map(c=>'<tr><td>'+esc(c.d)+'<br><small class="'+(!c.pg&&c.ve<hj?'r':'mu')+'">'+(c.pg?'paga em '+dd(c.pg):'vence '+c.ve.split('-').reverse().join('/'))+'</small></td><td class="n">'+R(c.v)+'</td><td class="n">'+(c.pg?'':'<button class="s" data-a="cpay" data-id="'+c.id+'">pagar</button> ')+'<button class="s" data-a="cdel" data-id="'+c.id+'">✕</button></td></tr>').join('')+'</table></div>'}
function rep(){const n=new Date(),f={hoje:new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),'7':Date.now()-6048e5,'30':Date.now()-2592e6,mes:new Date(n.getFullYear(),n.getMonth(),1).getTime(),tudo:0}[per],vs=S.v.filter(v=>v.t>=f),fat=vs.reduce((a,v)=>a+v.tot,0),dc=vs.reduce((a,v)=>a+v.dc,0),luc=vs.reduce((a,v)=>a+v.it.reduce((s,i)=>s+i.sub-i.cu*i.q,0),0),pg=S.c.filter(c=>c.pg&&c.pg>=f).reduce((a,c)=>a+c.v,0),ab=S.c.filter(c=>!c.pg).reduce((a,c)=>a+c.v,0),top={},dia={},fm={};
vs.forEach(v=>{fm[v.pg]=(fm[v.pg]||0)+v.tot;const k=dd(v.t);dia[k]=(dia[k]||0)+v.tot;v.it.forEach(i=>{const t=top[i.n]||(top[i.n]={q:0,s:0});t.q+=i.q;t.s+=i.sub})});
const T=(o,fn)=>'<table>'+Object.entries(o).map(fn).join('')+'</table>';
return '<div class="grid"><div class="k">Faturamento<b>'+R(fat)+'</b></div><div class="k">Vendas<b>'+vs.length+'</b></div><div class="k">Ticket médio<b>'+R(vs.length?fat/vs.length:0)+'</b></div><div class="k">Descontos dados<b>'+R(dc)+'</b></div><div class="k">Lucro bruto estimado<b>'+R(luc)+'</b></div><div class="k">Contas pagas<b>'+R(pg)+'</b></div><div class="k">Resultado (fat. − contas)<b>'+R(fat-pg)+'</b></div><div class="k">Contas em aberto<b>'+R(ab)+'</b></div></div><h3>Por forma de pagamento</h3>'+T(fm,([k,v])=>'<tr><td>'+k+'</td><td class="n">'+R(v)+'</td></tr>')+'<h3>Por dia</h3>'+T(dia,([k,v])=>'<tr><td>'+k+'</td><td class="n">'+R(v)+'</td></tr>')+'<h3>Produtos mais vendidos</h3>'+T(Object.fromEntries(Object.entries(top).sort((a,b)=>b[1].q-a[1].q).slice(0,15)),([k,v])=>'<tr><td>'+esc(k)+'</td><td class="n">'+v.q+' un.</td><td class="n">'+R(v.s)+'</td></tr>')+'<h3>Estoque baixo</h3><table>'+S.p.filter(p=>p.es<=p.mi).map(p=>'<tr><td>'+esc(p.n)+'</td><td class="n">'+p.es+'</td></tr>').join('')+'</table><h3>Vendas</h3><table>'+vs.slice().reverse().map(v=>'<tr><td>#'+v.n+' '+dt(v.t)+'</td><td>'+v.pg+'</td><td class="n">'+R(v.tot)+'</td></tr>').join('')+'</table>'}
function vR(){return '<div class="card"><select id="per">'+[['hoje','Hoje'],['7','Últimos 7 dias'],['30','Últimos 30 dias'],['mes','Este mês'],['tudo','Tudo']].map(o=>'<option value="'+o[0]+'"'+(per===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><div class="row"><button data-a="prep">Imprimir relatório</button></div></div><div class="card">'+rep()+'</div>'}
function vPDV(){const c=calc();let tot=0,full=0,n=0;const rows=c.L.map(l=>{tot+=l.sub;full+=l.full;n+=l.q;const p=l.p,i=l.i,k=p.pq>0&&p.pv>0;return '<div class="li"><span><button class="s" data-a="dec" data-id="'+p.id+'">−</button> <b>'+l.q+'x</b> <button class="s" data-a="inc" data-id="'+p.id+'">+</button></span><span>'+esc(p.n)+(k?'<br><small class="mu">'+(i.nc?'sem combo':'leve '+p.pq+' por '+R(p.pv))+'</small>':'')+'</span><span class="n">'+R(l.sub)+(l.sub<l.full-0.001?'<br><small class="g">−'+R(l.full-l.sub)+'</small>':'')+'</span><span>'+(k?'<button class="s" data-a="nc" data-id="'+p.id+'">'+(i.nc?'combo':'sem')+'</button> ':'')+'<button class="s" data-a="rm" data-id="'+p.id+'">✕</button></span></div>'}).join('');

function render(){$('#app').className=pdv?'pdv':'';$('#nav').style.display=pdv?'none':'';if(pdv){$('#app').innerHTML=vPDV();const b=$('#bc');b&&b.focus();return}const T=[['vendas','Vendas'],['produtos','Produtos'],['estoque','Estoque'],['caixa','Caixa'],['contas','Contas a pagar'],['rel','Relatórios']];$('#nav').innerHTML=T.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'<button class="p" data-a="gopdv" style="margin-left:auto">Modo PDV (F3)</button><button data-a="logout">Sair</button>';$('#app').innerHTML=({vendas:()=>'<div class="card"><p>As vendas são feitas no modo PDV.</p><button class="p" data-a="gopdv">Abrir modo PDV (F3)</button></div>',produtos:vP,estoque:vE,caixa:vC,contas:vA,rel:vR})[tab]()+'<p class="mu" id="st"></p>';ft();if(tab==='vendas'){const b=$('#bc');b&&b.focus()}}
function act(a,d){const p=d.id&&find(d.id),it=d.id&&cart.find(x=>x.id===d.id);
if(a==='inc')it.q++;else if(a==='dec'){it.q--;if(it.q<1)cart=cart.filter(x=>x!==it)}else if(a==='rm')cart=cart.filter(x=>x!==it);else if(a==='clr')cart=[];else if(a==='pay')pay=d.m;else if(a==='gopdv')pdv=true;else if(a==='gopn')pdv=false;else if(a==='nc')it.nc=!it.nc;else if(a==='addp'){const i=cart.find(x=>x.id===d.id);i?i.q++:cart.push({id:d.id,q:1})}
else if(a==='fin'){if(!cart.length)return toast('Carrinho vazio');if(!S.cx.open)return toast('Abra o caixa primeiro');const c=calc();let tot=0,full=0;const its=c.L.map(l=>{const p=l.p;tot+=l.sub;full+=l.full;p.es-=l.q;S.e.unshift({t:Date.now(),n:p.n,q:-l.q,tp:'venda'});return{n:p.n,q:l.q,pr:p.pr,cu:p.cu||0,sub:l.sub}});const v={id:uid(),n:S.v.length+1,t:Date.now(),it:its,tot,dc:full-tot,pg:pay};S.v.push(v);cart=[];save();render();$('#md').innerHTML='<div class="bx"><h3>Venda concluída</h3>'+rcp(v)+'<div class="row"><button class="p" data-a="pr" data-id="'+v.id+'">Imprimir recibo (Enter)</button><button data-a="dx">Fechar (Esc)</button></div></div>';$('#md').className='on';return}
else if(a==='pr'){prt(rcp(S.v.find(v=>v.id===d.id)));return}
else if(a==='nome'){S.nome=$('#nm').value.trim()||'Minha Loja';toast('Nome salvo')}
else if(a==='psave'){const n=$('#f_n').value.trim(),pr=num($('#f_pr').value);if(!n||!pr)return toast('Informe nome e preço');const cd=$('#f_c').value.trim();if(cd&&S.p.some(x=>x.c===cd&&x.id!==ED))return toast('Esse código já está em outro produto');const o={ck:false,n,c:$('#f_c').value.trim(),pr,cu:num($('#f_cu').value),es:num($('#f_es').value),mi:num($('#f_mi').value),pq:num($('#f_pq').value),pv:num($('#f_pv').value)};if(ED)Object.assign(find(ED),o);else S.p.push(Object.assign({id:uid()},o));ED=null}
else if(a==='pcan')ED=null;else if(a==='pe'){ED=d.id;setTimeout(()=>{scrollTo(0,0);const f=$('#f_c');f&&f.focus()},50)}
else if(a==='pd'){dlg('Excluir '+esc(p.n)+'?',[],()=>{S.p=S.p.filter(x=>x!==p);cart=cart.filter(x=>x.id!==p.id);save();render()});return}
else if(a==='ent'){dlg('Entrada: '+esc(p.n),[['Quantidade','','number']],v=>{const q=num(v[0]);if(!q)return;p.es+=q;S.e.unshift({t:Date.now(),n:p.n,q,tp:'entrada'});save();render()});return}
else if(a==='aj'){dlg('Contagem atual: '+esc(p.n),[['Quantidade em estoque',p.es,'number']],v=>{const q=num(v[0]);S.e.unshift({t:Date.now(),n:p.n,q:q-p.es,tp:'ajuste'});p.es=q;save();render()});return}
else if(a==='abrir')S.cx.open={t:Date.now(),v:num($('#ab').value)};
else if(a==='sup'||a==='san'){dlg(a==='sup'?'Suprimento':'Sangria',[['Valor','','number'],['Observação']],v=>{if(num(v[0])>0){S.cx.mov.push({t:Date.now(),tp:a,v:num(v[0]),o:v[1]});save();render()}});return}
else if(a==='fecha'){const c=cxs();dlg('Fechar caixa',[['Dinheiro contado na gaveta ('+R(c.esp)+' esperado)','','number']],v=>{const ct=num(v[0]);S.cx.hist.unshift({f:Date.now(),a:S.cx.open.t,esp:c.esp,cont:ct,dif:ct-c.esp});S.cx.open=null;S.cx.mov=[];save();render()});return}
else if(a==='cadd'){const x=$('#c_d').value.trim(),v=num($('#c_v').value),t=$('#c_t').value;if(!x||!v||!t)return toast('Preencha descrição, valor e vencimento');S.c.push({id:uid(),d:x,v,ve:t,pg:0})}
else if(a==='cpay')S.c.find(c=>c.id===d.id).pg=Date.now();
else if(a==='cdel'){S.c=S.c.filter(c=>c.id!==d.id)}
else if(a==='prep'){prt('<h3>'+esc(S.nome)+' — Relatório ('+per+')</h3>'+rep());return}
else if(a==='dok'){const v=[];for(let i=0;i<M.n;i++)v.push($('#d'+i).value);const f=M.ok;cls();f(v);return}
else if(a==='dx'){cls();const b=$('#bc');b&&b.focus();return}
save();render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;ED=null;render();return}const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='login')return doLogin();if(b.dataset.a==='logout'){sb.auth.signOut().then(()=>location.reload());return}act(b.dataset.a,b.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw'){doLogin();return}const pb=$('#md').querySelector('[data-a="pr"]');if(pb){if(e.key==='Enter'){e.preventDefault();act('pr',pb.dataset);return}if(e.key==='Escape'){cls();const b=$('#bc');b&&b.focus();return}}if(e.key==='F3'){e.preventDefault();if(!pdv){pdv=true;cls();render()}return}if(e.key==='F1'){e.preventDefault();if(pdv){pdv=false;cls();render()}return}if(e.key==='F4'&&pdv){e.preventDefault();act('fin',{});return}if(e.key==='Enter'&&e.target.id==='f_c'){e.preventDefault();act('psave',{});return}if(e.key==='Enter'&&e.target.id==='bc'){const v=e.target.value;e.target.value='';add(v)}});
document.addEventListener('change',e=>{if(e.target.id==='per'){per=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='pf'){const q=e.target.value.toLowerCase();document.querySelectorAll('#pl tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none');return}if(e.target.id!=='bc'||!pdv)return;const q=e.target.value.trim().toLowerCase(),s=$('#sr');s.innerHTML=q?S.p.filter(p=>p.n.toLowerCase().includes(q)||(p.c&&p.c.includes(q))).slice(0,24).map(p=>'<button class="tl" data-a="addp" data-id="'+p.id+'"><b>'+esc(p.n)+'</b><small>'+R(p.pr)+'</small></button>').join(''):'<p class="mu">Digite o nome ou bipe o código e tecle Enter.</p>'});
function loginView(){$('#nav').innerHTML='';$('#app').className='';$('#app').innerHTML='<div class="card" style="max-width:360px;margin:40px auto"><h3>Entrar no PDV</h3><label>E-mail<input id="em" type="email" autocomplete="username"></label><label>Senha<input id="pw" type="password" autocomplete="current-password"></label><button class="p" data-a="login" style="width:100%">Entrar</button></div>'}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)return toast('E-mail ou senha inválidos');await loadAll();render()}
async function loadAll(){let loc={};try{loc=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
try{const r=await sb.from('pdv_config').select('dados').eq('id','principal').maybeSingle();if(r.error)throw r.error;if(r.data)Object.assign(S,r.data.dados);
let v=[],from=0;for(;;){const q=await sb.from('pdv_vendas').select('dados').order('t',{ascending:true}).range(from,from+999);if(q.error)throw q.error;v=v.concat(q.data.map(x=>Object.assign(x.dados,{ok:1})));if(q.data.length<1000)break;from+=1000}
const ids=new Set(v.map(x=>x.id));S.v=v.concat((loc.v||[]).filter(x=>!x.ok&&!ids.has(x.id)));st='Salvo no Supabase';if(!r.data||S.v.some(x=>!x.ok))save()}
catch(e){Object.assign(S,loc);S.v=S.v||[];st='Sem conexão com o Supabase: usando a cópia deste navegador'}}
async function boot(){if(SB_URL.indexOf('COLE')===0){$('#app').innerHTML='<div class="card"><h3>Falta configurar</h3><p>Abra o arquivo e preencha SB_URL e SB_KEY no começo do script.</p></div>';return}
sb=supabase.createClient(SB_URL,SB_KEY);const s=await sb.auth.getSession();if(!s.data.session)return loginView();await loadAll();render()}
boot();
</script></body></html>
