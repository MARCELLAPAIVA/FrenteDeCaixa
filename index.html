const SB_URL='https://hyqllkegmufiwixgsitz.supabase.co',SB_KEY='sb_publishable_1lT2ctRftaUtCB9AR1fbUQ_SrzHvTnr';
let S={nome:'Minha Loja',p:[],v:[],e:[],c:[],cx:{open:null,mov:[],hist:[]}},tab='vendas',pdv=false,cart=[],pay='dinheiro',per='dia',rsel='resumo',rd=new Date().toLocaleDateString('sv'),ED=null,M=null,sb=null,st='Conectando ao Supabase…',tm;
function lc(){try{localStorage.setItem(K,JSON.stringify(Object.assign({},S,{v:S.v.filter(x=>!x.ok)})))}catch(e){}}
let LOADED=false,SNAP={p:{},c:{},cfg:''},busy=0,again=0;const strip=p=>{const d=Object.assign({},p);delete d.es;return d};
async function sv(){if(!sb)return;if(!LOADED){st='ERRO: leitura do Supabase falhou; nada foi gravado por segurança. Recarregue a página';ft();return}if(busy){again=1;return}busy=1;

const cid=new Set(S.c.map(c=>c.id)),dc=Object.keys(SNAP.c).filter(i=>!cid.has(i));if(dc.length){ck(await sb.from('pdv_contas').delete().in('id',dc));dc.forEach(i=>delete SNAP.c[i])}

S.e=S.e.slice(0,300);st='Salvo no Supabase';lc()}catch(e){console.error('Erro ao salvar',e);st='ERRO ao salvar no Supabase: '+(e&&(e.message||e.details)||e)}
busy=0;ft();if(/ERRO/.test(st))toast('Não foi possível salvar no Supabase');if(again){again=0;save()}}

function cls(){$('#md').className='';M=null}
const find=id=>S.p.find(x=>x.id===id);
const PL={dinheiro:'Dinheiro',pix:'Pix',debito:'Débito',credito:'Crédito',voucher:'Voucher','cartão':'Cartão'};
const acr=(m,v)=>v<=0.0001?0:(m==='credito'||m==='voucher')?Math.round(v*5)/100:m==='debito'?1:0;
const pgsOf=v=>v.pgs||[{m:v.pg,v:v.tot,ac:0}];
const cobOf=v=>v.cob!=null?v.cob:v.tot;
function calc(){const L=cart.map(i=>{const p=find(i.id);return{i,p,q:i.q,full:i.q*p.pr,sub:i.q*p.pr}}),G={};
L.forEach(l=>{const k=l.p.pq>0&&l.p.pv>0&&!l.i.nc?l.p.pq+'x'+l.p.pv:'';if(k){const g=G[k]||(G[k]={N:l.p.pq,V:l.p.pv,ls:[],q:0});g.ls.push(l);g.q+=l.q}});
Object.values(G).forEach(g=>{g.c=Math.floor(g.q/g.N);g.r=g.q%g.N;if(!g.c)return;const u=[];g.ls.forEach(l=>{for(let x=0;x<l.q;x++)u.push(l.p.pr)});u.sort((a,b)=>a-b);let pr=g.c*g.V;for(let x=g.c*g.N;x<u.length;x++)pr+=u[x];const fl=g.ls.reduce((a,l)=>a+l.full,0);let rest=pr;g.ls.forEach((l,x)=>{l.sub=x===g.ls.length-1?Math.round(rest*100)/100:Math.round(pr*l.full/fl*100)/100;rest-=l.sub});g.pr=pr;g.fl=fl});
return{L,G}}
function add(code){code=(code||'').trim();if(!code)return;const l=code.toLowerCase();const p=S.p.find(x=>x.c&&x.c===code)||S.p.find(x=>x.n.toLowerCase()===l)||S.p.find(x=>x.n.toLowerCase().includes(l));if(!p)return toast('Produto não encontrado');const i=cart.find(x=>x.id===p.id);i?i.q++:cart.push({id:p.id,q:1});render()}
function cxs(){const o=S.cx.open,vs=S.v.filter(v=>v.t>=o.t),by=m=>vs.reduce((a,v)=>a+pgsOf(v).filter(p=>p.m===m).reduce((s,p)=>s+p.v+(p.ac||0),0),0),mv=k=>S.cx.mov.filter(m=>m.t>=o.t&&m.tp===k).reduce((a,m)=>a+m.v,0);const din=by('dinheiro'),sup=mv('sup'),san=mv('san');return{vs,din,pix:by('pix'),deb:by('debito'),cre:by('credito'),vou:by('voucher'),car:by('cartão'),sup,san,esp:o.v+din+sup-san}}
function rcp(v){const w=32,L=[S.nome||'Minha Loja','Recibo de venda nº '+v.n,dt(v.t),'-'.repeat(w)];v.it.forEach(i=>{L.push(i.n);L.push(((i.q+' x '+R(i.pr)).padEnd(w-11))+R(i.sub).padStart(11))});L.push('-'.repeat(w));if(v.dc>0.001)L.push('Desconto'.padEnd(w-11)+('-'+R(v.dc)).padStart(11));if(v.ac>0.001)L.push('Acréscimo'.padEnd(w-11)+('+'+R(v.ac)).padStart(11));L.push('TOTAL'.padEnd(w-12)+R(cobOf(v)).padStart(12),'Pagamento:');pgsOf(v).forEach(p=>L.push(((PL[p.m]||p.m)+(p.ac>0?' (+'+R(p.ac)+')':'')).padEnd(w-12)+R(p.v+(p.ac||0)).padStart(12)));if(v.rc!=null)L.push('Recebido'.padEnd(w-12)+R(v.rc).padStart(12),'Troco'.padEnd(w-12)+R(v.tr).padStart(12));L.push('','Obrigado pela preferência!','(Documento sem valor fiscal)');return '<pre>'+esc(L.join('\n'))+'</pre>'}
function openProd(id){ED=id;const e=id?find(id):{},F=(i,l,v,t)=>'<label>'+l+'<input id="'+i+'" type="'+(t||'text')+'" step="any" value="'+esc(v==null?'':v)+'"></label>';$('#md').innerHTML='<div class="bx" style="max-width:520px"><h3>'+(id?'Editar produto':'Novo produto')+'</h3>'+F('f_n','Nome',e.n)+F('f_c','Código de barras',e.c)+'<div class="grid">'+F('f_pr','Preço (R$)',e.pr,'number')+F('f_cu','Custo (R$)',e.cu,'number')+F('f_es','Estoque',e.es,'number')+F('f_mi','Estoque mínimo',e.mi,'number')+F('f_pq','Promoção: leve (qtd)',e.pq,'number')+F('f_pv','Promoção: por (R$)',e.pv,'number')+'</div><p class="mu"><small>Ex.: leve 5 por R$ 10. Produtos com o mesmo “leve N por R$ X” se somam sozinhos na venda, sem apertar nada.</small></p><div class="row"><button class="p" data-a="psave">Salvar</button><button data-a="pcan">Fechar</button></div></div>';$('#md').className='on';setTimeout(()=>{const x=$(id?'#f_n':'#f_c');x&&x.focus()},30)}
function rr(){const pf=$('#pf'),fv=pf?pf.value:'',y=scrollY;render();if(tab==='produtos'){const n=$('#pf');if(n&&fv){n.value=fv;n.dispatchEvent(new Event('input',{bubbles:true}))}scrollTo(0,y)}}
let TT=0;
function openPag(t){TT=t;const rows=[['pix','Pix',''],['debito','Débito','+ R$ 1,00'],['credito','Crédito','+ 5%'],['voucher','Voucher','+ 5%']].map(r=>'<div class="pr"><span>'+r[1]+(r[2]?' <small class="mu">'+r[2]+'</small>':'')+'</span><input id="pg_'+r[0]+'" type="number" step="any" inputmode="decimal" placeholder="0,00"><button class="s" data-a="pgall" data-m="'+r[0]+'">Tudo</button></div>').join('');
$('#md').innerHTML='<div class="bx"><h3>Pagamento</h3><div class="tot" style="margin:0 0 6px"><span>Total da compra</span><b>'+R(t)+'</b></div><p class="mu" style="margin:0 0 10px"><small>Divida a compra entre as formas. O que não for informado em Pix, Débito, Crédito ou Voucher é pago em dinheiro.</small></p>'+rows+'<label style="margin-top:10px">Dinheiro recebido (opcional, para calcular troco)<input id="pg_din" type="number" step="any" inputmode="decimal" placeholder="Ex.: 50"></label><div class="row" style="margin:0 0 10px"><button data-a="rcq" data-v="x">Exato</button><button data-a="rcq" data-v="10">10</button><button data-a="rcq" data-v="20">20</button><button data-a="rcq" data-v="50">50</button><button data-a="rcq" data-v="100">100</button></div><div id="pgsum"></div><div class="row"><button class="p" data-a="fin2">Confirmar venda (F4)</button><button data-a="dx">Cancelar</button></div></div>';$('#md').className='on';trUpd();setTimeout(()=>{const x=$('#pg_din');x&&x.focus()},30)}
function pgCalc(t){const g=id=>{const e=$('#'+id);return e?Math.max(0,num(e.value)):0},nc={pix:g('pg_pix'),debito:g('pg_debito'),credito:g('pg_credito'),voucher:g('pg_voucher')},sn=nc.pix+nc.debito+nc.credito+nc.voucher;let din=Math.round((t-sn)*100)/100;if(Math.abs(din)<0.005)din=0;let ac=0;for(const k in nc)ac+=acr(k,nc[k]);ac=Math.round(ac*100)/100;const e=$('#pg_din');return{nc,din,ac,cob:Math.round((t+ac)*100)/100,raw:e?e.value.trim():''}}
function trUpd(){const e=$('#pgsum');if(!e)return;const c=pgCalc(TT);let h='';if(c.din<-0.001)h='<div class="r">Os valores informados passam do total da compra</div>';else{h+='<div class="tot" style="font-size:16px;margin:4px 0"><span>Dinheiro (restante)</span><span>'+R(c.din)+'</span></div>';if(c.ac>0)h+='<div class="tot" style="font-size:16px;margin:4px 0"><span>Acréscimos</span><span>+'+R(c.ac)+'</span></div>';h+='<div class="tot"><span>Total a cobrar</span><b>'+R(c.cob)+'</b></div>';if(c.din>0.001){const rc=c.raw?num(c.raw):c.din,d=Math.round((rc-c.din)*100)/100;h+=d<-0.001?'<div class="tot r"><span>Faltam</span><b>'+R(-d)+'</b></div>':'<div class="tot g"><span>Troco</span><b>'+R(d)+'</b></div>'}}e.innerHTML=h}

function vP(){const e=ED?find(ED):{},F=(id,l,v,t)=>'<label>'+l+'<input id="'+id+'" type="'+(t||'text')+'" step="any" value="'+esc(v==null?'':v)+'"></label>';

function impCSV(f){const r=new FileReader();r.onload=()=>{const L=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(L.length<2)return toast('Arquivo vazio');const sp=L[0].includes(';')?';':',',H=L[0].split(sp).map(x=>x.trim().toLowerCase()),ix=k=>H.indexOf(k);if(ix('nome')<0||ix('ean')<0)return toast('Faltam as colunas nome e ean');const have=new Set(S.p.map(p=>p.c).filter(Boolean));const rp=$('#rpl')&&$('#rpl').checked;if(rp){if(!confirm('Isso APAGA todos os '+S.p.length+' produtos atuais e deixa só os do arquivo. Continuar?'))return;S.p=[];cart=[]}const hn=new Set(S.p.filter(p=>!p.c).map(p=>p.n.toLowerCase()));let add=0,ign=0,sem=0;L.slice(1).forEach((ln,i)=>{const c=ln.split(sp),n=(c[ix('nome')]||'').trim(),e=(c[ix('ean')]||'').replace(/\D/g,''),pr=ix('preco')>=0?num(c[ix('preco')]):0,es=ix('estoque')>=0?num(c[ix('estoque')]):0;if(!n)return;const nk=n.toLowerCase();if(e?have.has(e):hn.has(nk)){ign++;return}if(!e){sem++;hn.add(nk)}else have.add(e);S.p.push({id:uid()+i,ck:!pr,n,c:e,pr,cu:0,es,mi:0,pq:0,pv:0});add++});S.p.sort((a,b)=>a.n.localeCompare(b.n,'pt-BR'));save();render();toast((rp?'Lista substituída: ':'')+add+' importados, '+ign+' já existiam'+(sem?', '+sem+' sem código':''))};r.readAsText(f,'utf-8')}
